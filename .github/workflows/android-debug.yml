name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-debug.yml"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create/Update debug Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-debug
          name: v0.1.0-debug — Debug-APK
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: false
          body: |
            Debug-APK zum Testen auf dem Handy (nicht für den Play Store).

            **Installation**
            1. `app-debug.apk` herunterladen (unten bei Assets)
            2. Auf dem Gerät „Installation aus unbekannten Quellen“ für den Browser/Dateimanager erlauben
            3. APK öffnen und installieren

            Neueste zuerst: dieser Release wird bei jedem passenden Build überschrieben/aktualisiert.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
